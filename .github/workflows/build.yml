name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libusb-1.0-0-dev libxml2-dev qt6-base-dev libgl1-mesa-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb pkg-config libxml2 qt

      # The fork must still build standalone with its own Makefile (Linux only).
      - name: Engine standalone build (Linux)
        if: runner.os == 'Linux'
        run: make -C external/SF100Linux

      - name: Configure
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            EXTRA="-DCMAKE_PREFIX_PATH=$(brew --prefix libxml2);$(brew --prefix qt)"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $EXTRA

      - name: Build
        run: cmake --build build -j

      # With no arguments dpcmd prints its usage and exits before touching USB.
      - name: Smoke test
        run: ./build/dpcmd

      # Builds the whole UI but never opens USB (offscreen platform plugin, no display needed).
      - name: GUI smoke test
        run: |
          export QT_QPA_PLATFORM=offscreen
          if [ "$RUNNER_OS" = "macOS" ]; then
            ./build/gui/sf100gui.app/Contents/MacOS/sf100gui --smoke
          else
            ./build/gui/sf100gui --smoke
          fi

      - name: Clean engine standalone build (Linux)
        if: runner.os == 'Linux'
        run: make -C external/SF100Linux clean

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Single-file Linux app with Qt, libusb and libxml2 bundled. Runs on distros with glibc >= the runner's
      # (Ubuntu 24.04). The udev rule still has to be installed on the host. Tools pinned to release tags.
      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          LINUXDEPLOY_TAG: 1-alpha-20251107-1
          PLUGIN_QT_TAG: 1-alpha-20250213-1
          APPIMAGE_EXTRACT_AND_RUN: 1 # no FUSE on the runner
        run: |
          base=https://github.com/linuxdeploy
          curl -fsSL -o linuxdeploy-x86_64.AppImage "$base/linuxdeploy/releases/download/$LINUXDEPLOY_TAG/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o linuxdeploy-plugin-qt-x86_64.AppImage "$base/linuxdeploy-plugin-qt/releases/download/$PLUGIN_QT_TAG/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy*.AppImage
          # bin/sf100gui + share/DediProg/ChipInfoDb.dedicfg (found via <exe_dir>/../share/DediProg)
          DESTDIR="$PWD/AppDir" cmake --install build --prefix /usr
          export QMAKE=$(command -v qmake6 || echo /usr/lib/qt6/bin/qmake)
          export EXTRA_PLATFORM_PLUGINS=libqoffscreen.so # for the smoke test below
          export LDAI_OUTPUT=sf100gui-x86_64.AppImage OUTPUT=sf100gui-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            -e AppDir/usr/bin/sf100gui -e AppDir/usr/bin/dpcmd \
            -d gui/sf100gui.desktop -i gui/sf100gui.svg \
            --plugin qt --output appimage
          QT_QPA_PLATFORM=offscreen ./sf100gui-x86_64.AppImage --smoke
          mkdir -p dist && mv sf100gui-x86_64.AppImage dist/

      # Self-contained app: Qt, libusb, libxml2 and their dependencies are copied into the bundle, so it runs
      # without Homebrew. dpcmd is shipped inside too (finds the chip DB in ../Resources).
      - name: Deploy macOS app
        if: runner.os == 'macOS'
        run: |
          APP=build/gui/sf100gui.app
          cp build/dpcmd "$APP/Contents/MacOS/"
          cp LICENSE "$APP/Contents/Resources/"
          "$(brew --prefix qt)/bin/macdeployqt" "$APP" -executable="$APP/Contents/MacOS/dpcmd" -always-overwrite
          # install_name_tool invalidated the signatures; Apple Silicon refuses unsigned code, so sign ad hoc.
          codesign --force --deep --sign - "$APP"
          # Fail if any binary in the bundle still loads a library from Homebrew.
          if find "$APP" -type f \( -perm +111 -o -name '*.dylib' \) -exec otool -L {} + | grep -E '^\s+(/opt/homebrew|/usr/local)/'; then
            echo "::error::bundle still references Homebrew libraries"; exit 1
          fi
          "$APP/Contents/MacOS/sf100gui" --smoke
          "$APP/Contents/MacOS/dpcmd"
          mkdir -p dist
          hdiutil create -volname "SF100 GUI" -srcfolder "$APP" -ov -format UDZO dist/sf100gui-${{ matrix.os }}.dmg

      # tar keeps the executable bit (the artifact zip alone would drop it)
      - name: Package
        run: |
          mkdir -p dist/dpcmd
          cp build/dpcmd build/ChipInfoDb.dedicfg external/SF100Linux/60-dediprog.rules LICENSE dist/dpcmd/
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R build/gui/sf100gui.app dist/dpcmd/
          else
            cp build/gui/sf100gui dist/dpcmd/
          fi
          tar -czf dist/dpcmd-${{ matrix.os }}.tar.gz -C dist dpcmd

      - uses: actions/upload-artifact@v6
        with:
          name: dpcmd-${{ matrix.os }}
          path: dist/dpcmd-${{ matrix.os }}.tar.gz

      - uses: actions/upload-artifact@v6
        if: runner.os == 'Linux'
        with:
          name: sf100gui-x86_64-appimage
          path: dist/sf100gui-x86_64.AppImage

      - uses: actions/upload-artifact@v6
        if: runner.os == 'macOS'
        with:
          name: sf100gui-${{ matrix.os }}-dmg
          path: dist/sf100gui-${{ matrix.os }}.dmg
