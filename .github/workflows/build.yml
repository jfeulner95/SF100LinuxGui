name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libusb-1.0-0-dev libxml2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb pkg-config libxml2

      # The fork must still build standalone with its own Makefile (Linux only).
      - name: Engine standalone build (Linux)
        if: runner.os == 'Linux'
        run: make -C external/SF100Linux

      - name: Configure
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            EXTRA="-DCMAKE_PREFIX_PATH=$(brew --prefix libxml2)"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $EXTRA

      - name: Build
        run: cmake --build build -j

      # With no arguments dpcmd prints its usage and exits before touching USB.
      - name: Smoke test
        run: ./build/dpcmd

      - name: Clean engine standalone build (Linux)
        if: runner.os == 'Linux'
        run: make -C external/SF100Linux clean

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - uses: actions/upload-artifact@v5
        with:
          name: dpcmd-${{ matrix.os }}
          path: build/dpcmd
